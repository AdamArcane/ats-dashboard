name: Release to R2

# Two ways to trigger a release:
#   1. Push a tag manually:
#        git tag vX.Y.Z && git push origin vX.Y.Z
#      (bump the "Version:" header and ATS_DASHBOARD_PLUGIN_VERSION constant
#      in ats-dashboard.php to match first — this workflow fails fast if
#      they don't match, rather than silently shipping a mismatched build)
#   2. Run this workflow manually from the Actions tab and pick a bump
#      type (patch/minor/major) — it bumps the version, commits, tags,
#      and pushes for you, then builds and releases in the same run.
#
# To re-run a past release (e.g. a flaky R2 upload), use "Re-run all
# jobs" on that specific historical run in the Actions tab instead of
# re-tagging or dispatching again.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type: patch | minor | major'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: ver
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"

            # Reruns of a workflow_dispatch job check out the commit that
            # existed at dispatch time, not the current tip — so pull first,
            # otherwise CURRENT below would be read from a stale, pre-bump
            # checkout and we'd try to bump again on top of a bump that
            # already landed (and already has a tag) from an earlier attempt.
            git pull --rebase origin main

            CURRENT=$(grep -m1 "ATS_DASHBOARD_PLUGIN_VERSION" ats-dashboard.php | sed -E "s/.*'([0-9][^']*)'.*/\1/")
            LAST_COMMIT_SUBJECT=$(git log -1 --pretty=%s)

            if [ "$LAST_COMMIT_SUBJECT" = "Bump version to v${CURRENT}" ]; then
              # HEAD is already our own bump commit for $CURRENT — this run is
              # retrying after an earlier attempt got past the bump/tag but
              # failed later (e.g. the R2 upload). Reuse that version instead
              # of bumping again, so retries are safe to re-dispatch.
              NEW_VERSION="$CURRENT"
              echo "HEAD is already 'Bump version to v${CURRENT}' — reusing it instead of bumping again."
            else
              MAJOR=$(echo "$CURRENT" | cut -d. -f1)
              MINOR=$(echo "$CURRENT" | cut -d. -f2)
              PATCH=$(echo "$CURRENT" | cut -d. -f3)
              case "${{ github.event.inputs.bump }}" in
                major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
                minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
                *)     PATCH=$((PATCH + 1)) ;;
              esac
              NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

              sed -i "s/^ \* Version:.*/ * Version: ${NEW_VERSION}/" ats-dashboard.php
              sed -i -E "s/define\( 'ATS_DASHBOARD_PLUGIN_VERSION',[[:space:]]*'[^']*' \)/define( 'ATS_DASHBOARD_PLUGIN_VERSION', '${NEW_VERSION}' )/" ats-dashboard.php

              git add ats-dashboard.php
              git commit -m "Bump version to v${NEW_VERSION}"
              git push origin HEAD:main
            fi

            NEW_TAG="v${NEW_VERSION}"
            if git ls-remote --exit-code --tags origin "refs/tags/${NEW_TAG}" > /dev/null 2>&1; then
              echo "Tag ${NEW_TAG} already exists on origin — not re-tagging."
            else
              git tag "$NEW_TAG"
              git push origin "$NEW_TAG"
            fi

            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify plugin version matches the release
        run: |
          set -e
          EXPECTED="${{ steps.ver.outputs.version }}"
          HEADER_VERSION=$(grep -m1 '^ \* Version:' ats-dashboard.php | sed -E 's/.*Version:[[:space:]]*//')
          CONST_VERSION=$(grep -m1 "ATS_DASHBOARD_PLUGIN_VERSION" ats-dashboard.php | sed -E "s/.*'([0-9][^']*)'.*/\1/")
          echo "expected=$EXPECTED header=$HEADER_VERSION const=$CONST_VERSION"
          if [ "$HEADER_VERSION" != "$EXPECTED" ] || [ "$CONST_VERSION" != "$EXPECTED" ]; then
            echo "::error::Version mismatch — bump the Version header and ATS_DASHBOARD_PLUGIN_VERSION to $EXPECTED before tagging."
            exit 1
          fi

      - name: Build zip
        run: |
          mkdir -p build/ats-dashboard
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='build' \
            --exclude='.gitignore' --exclude='.vscode' --exclude='.claude' \
            --exclude='_to_delete' --exclude='node_modules' --exclude="*.DS_Store" \
            --exclude='tests' --exclude='.parcel-cache' \
            --exclude='package.json' --exclude='package-lock.json' \
            --exclude='ats-dashboard.zip' \
            ./ build/ats-dashboard/
          cd build && zip -rq ../ats-dashboard.zip ats-dashboard

      - name: Write manifest
        run: |
          cat > info.json <<EOF2
          {
            "name": "ATS Dashboard",
            "version": "${{ steps.ver.outputs.version }}",
            "download_url": "https://files.arcanetechct.com/ats-dashboard/ats-dashboard.zip",
            "homepage": "https://github.com/arcanetechct/ats-dashboard",
            "requires": "5.8",
            "requires_php": "7.4",
            "tested": "6.6",
            "last_updated": "$(date -u +'%Y-%m-%d %H:%M:%S')",
            "sections": {
              "description": "ATS Dashboard gives you full control over your WordPress Dashboard. Remove the default Dashboard Widgets and create your own for a better user experience.",
              "changelog": "See https://github.com/arcanetechct/ats-dashboard/releases"
            }
          }
          EOF2

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          aws s3 cp ats-dashboard.zip \
            "s3://plugins/ats-dashboard/ats-dashboard.zip" \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/zip" \
            --cache-control "no-cache, must-revalidate"
          aws s3 cp ats-dashboard.zip \
            "s3://plugins/ats-dashboard/ats-dashboard-${{ steps.ver.outputs.version }}.zip" \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/zip" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp info.json \
            "s3://plugins/ats-dashboard/info.json" \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/json" \
            --cache-control "no-cache, must-revalidate"
